name: tls-check
on:
  push:
    branches: [ci/tls-check]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Start RabbitMQ (plain + TLS)
        run: ./.github/setup-unit.sh
      - name: Check TLS listener
        run: |
          docker compose -f docker-compose-ci.yml ps
          echo | openssl s_client -connect localhost:5671 -servername localhost -CAfile certs/ca.crt 2>/dev/null | grep -E "Verify return code|subject=" || true
      - name: Test
        run: ./gradlew test --no-daemon
      - name: Test report
        if: always()
        run: |
          for f in build/test-results/test/*.xml; do grep -o '<testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f"; done
          grep -l "<failure" build/test-results/test/*.xml | xargs -r grep -A3 "<failure" | head -60
      - name: Broker logs
        if: failure()
        run: docker compose -f docker-compose-ci.yml logs --tail 80
